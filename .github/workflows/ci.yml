# Continuous integration.
#
# The race detector needs an external linker, which means a C toolchain. Rather
# than requiring one on every developer machine, it runs here on Linux where the
# toolchain is already present.
#
# Only GitHub's own actions are used, and nothing is fetched into the module.
# The dependency proof below is the same one a judge runs by hand.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Prove the dependency manifest is empty
        run: |
          cat go.mod
          test -z "$(go list -m all | tail -n +2)" || {
            echo "go list -m all reported a dependency"; exit 1;
          }

      - name: Check for dependency violations
        run: go run ./tools/check .

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        run: go test -race ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o vitals ./cmd/vitals

  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build twice and compare
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o vitals.repro1 ./cmd/vitals
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o vitals.repro2 ./cmd/vitals
          go run ./tools/sha256sum vitals.repro1 vitals.repro2
          cmp vitals.repro1 vitals.repro2
